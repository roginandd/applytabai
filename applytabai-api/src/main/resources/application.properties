spring.application.name=applytabai-api
spring.config.import=optional:file:.env[.properties]
server.port=${SPRING_BOOT_PORT:8080}
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/mydb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:5MB}
app.security.jwt.secret=${APP_SECURITY_JWT_SECRET:dev-only-applytabai-jwt-secret-change-me-32-chars-minimum}
app.security.jwt.issuer=${APP_SECURITY_JWT_ISSUER:applytabai-api}
app.security.jwt.access-token-ttl=${APP_SECURITY_JWT_ACCESS_TOKEN_TTL:PT15M}
app.security.jwt.refresh-token-ttl=${APP_SECURITY_JWT_REFRESH_TOKEN_TTL:P7D}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.resume.storage.local-root=${APP_RESUME_STORAGE_LOCAL_ROOT:./storage/resumes}
management.endpoints.web.exposure.include=health,info
